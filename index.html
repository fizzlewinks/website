<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>analogpixels</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto&display=swap" rel="stylesheet"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  
</head>
<script>
  function showGallery(type) {
    document.getElementById('urban-gallery').classList.remove('active');
    document.getElementById('car-gallery').classList.remove('active');

    if (type === 'urban') {
      document.getElementById('urban-gallery').classList.add('active');
    } else {
      document.getElementById('car-gallery').classList.add('active');
    }
  }
</script>

<body>
<nav>
  <div class="nav-container">
    <div class="logo">analogpixels</div>
    <div class="nav-links">
      <button onclick="showGallery('urban')">Urban</button>
      <button onclick="showGallery('cars')">Automotive</button>
    </div>
  </div>
</nav>


<main>
  <!-- Urban Gallery Wrapper -->
  <div id="urban-gallery" class="gallery-wrapper active">
    <section class="gallery">
      <div class="gallery-item"><img src="src/urban/L2040531.jpg"></div>
      <div class="gallery-item"><img src="src/urban/L2040670.jpg"></div>
      <div class="gallery-item"><img src="src/urban/L2040703.jpg"></div>
      <div class="gallery-item"><img src="src/urban/L2100342.jpg"></div>
      <div class="gallery-item"><img src="src/urban/L2050137.jpg"></div>
      <div class="gallery-item"><img src="src/urban/DSC00639.jpg"></div>
      <div class="gallery-item"><img src="src/urban/L2050300.jpg"></div>
      <div class="gallery-item"><img src="src/urban/L2100276.jpg"></div>
      <div class="gallery-item"><img src="src/urban/L2100197.jpg"></div>
      <div class="gallery-item"><img src="src/urban/L2100211.jpg"></div>
      <div class="gallery-item"><img src="src/urban/L2100322.jpg"></div>
      <div class="gallery-item"><img src="src/urban/L2100367.jpg"></div>
    </section>
  </div>

  <!-- Car Gallery Wrapper -->
  <div id="car-gallery" class="gallery-wrapper">
    <section class="gallery">
      <div class="gallery-item"><img src="src/cars/L2060529.jpg"></div>
      <div class="gallery-item"><img src="src/cars/L2060861.jpg"></div>
      <div class="gallery-item"><img src="src/cars/L2090009.jpg"></div>
    </section>
  </div>

  <section id="social" class="social-section">
    <a href="https://instagram.com/bach.webp" target="_blank" rel="noopener noreferrer" class="social-icon">
      <img src="instagram.png" alt="Instagram" />
    </a>
  </section>
</main>


  <footer>
    <div class="footer-content">
      <span>&copy; 2025 Bach Ta. All rights reserved.</span>
    </div>
  </footer>

  <script>
    function showGallery(type) {
      document.getElementById('urban-gallery').classList.remove('active');
      document.getElementById('car-gallery').classList.remove('active');

      if (type === 'urban') {
        document.getElementById('urban-gallery').classList.add('active');
      } else {
        document.getElementById('car-gallery').classList.add('active');
      }
    }
  </script>
</body>
</html>
